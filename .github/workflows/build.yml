name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle.properties 里写死了本机的 org.gradle.java.home=D:\Java\zulu25,
      # 在 CI 上不存在,先移除,由 setup-java 提供的 JAVA_HOME 接管。
      - name: Remove local-only org.gradle.java.home
        shell: pwsh
        run: |
          (Get-Content gradle.properties) |
            Where-Object { $_ -notmatch '^org\.gradle\.java\.home' } |
            Set-Content gradle.properties

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ⚠️ Sided-IO 只从 `mavenLocal` 解析（见 build.gradle.kts 的 repositories），
      # 而 CI runner 上什么都没有 → 直接 build 会挂在"找不到 top.mc506lw.rebar.sidedio:Sided-IO"。
      # 所以这里先把 Sided-IO 源码拉下来、`publishToMavenLocal` 一份。
      #
      # 为什么不用 JitPack / GitHub Packages：Sided-IO 目前没发布到任何远程仓库，
      # 而它的坐标是自定义 group（`top.mc506lw.rebar.sidedio`），JitPack 默认只认
      # `com.github.<user>:<repo>`，硬套要额外的 jitpack.yml。直接在 CI 里编一份最省事、也最确定。
      - name: Build Sided-IO into mavenLocal
        run: |
          git clone --depth 1 https://github.com/LapisWorks/Lapis-SidedIO.git "$RUNNER_TEMP/sidedio"
          cd "$RUNNER_TEMP/sidedio"
          # ⚠️ 仓库里那份 gradle.properties 是在 Windows 上提交的，带着
          # `org.gradle.java.home=C://...` —— Linux runner 上这个路径不存在，Gradle 直接起不来。
          # （上面那个 "Remove local-only org.gradle.java.home" 步骤只清了本仓库的，没清这份。）
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lapis-IronFurnaces
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

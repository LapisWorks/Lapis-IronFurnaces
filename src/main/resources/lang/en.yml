addon: "Lapis-IronFurnaces"

# Side modes (`SideMode`) registered by this addon for Sided-IO.
#
# WARNING: the key root is THIS addon's namespace (`ironfurnaces`), not `sidedio` —
# a custom side mode's translation key is `<namespace>.mode.<name>`,
# see `SideMode.translationKey`.
mode:
  fuel_input_eject: "<gold>Fuel Input/Eject"

# Per-item lore (tooltip)
tooltip:
  # %ticks% = ticks to finish a 200-tick recipe (mirrors 26.3's tooltip.ironfurnaces.cooktime)
  cooktime: "<blue>Cook time <dark_gray>·<gray> %ticks% ticks"

guide:
  page:
    ironfurnaces: "<yellow>Lapis-IronFurnaces"

item:

  wireless_heater:
    name: "<b>Wireless Energy Heater"
    lore: |-
      <gray>Stores 1,000,000 J and powers bound heater rods
  item_heater:
    name: "<b>Heater Rod"
    lore: |-
      <gray>Right-click a heater to bind it, then put it in a furnace's fuel slot to run on power


  upgrade_copper:
    name: "<6>Upgrade: Furnace → Copper"
    lore: |-
      <gray>Turns a vanilla furnace into a Copper Furnace
  upgrade_iron:
    name: "<6>Upgrade: Furnace → Iron"
    lore: |-
      <gray>Turns a vanilla furnace into an Iron Furnace
  upgrade_iron2:
    name: "<6>Upgrade: Copper → Iron"
    lore: |-
      <gray>Turns a Copper Furnace into an Iron Furnace
  upgrade_gold:
    name: "<6>Upgrade: Iron → Gold"
    lore: |-
      <gray>Turns an Iron Furnace into a Gold Furnace
  upgrade_diamond:
    name: "<6>Upgrade: Gold → Diamond"
    lore: |-
      <gray>Turns a Gold Furnace into a Diamond Furnace
  upgrade_crystal:
    name: "<6>Upgrade: Diamond → Crystal"
    lore: |-
      <gray>Turns a Diamond Furnace into a Crystal Furnace
  upgrade_emerald:
    name: "<6>Upgrade: Diamond → Emerald"
    lore: |-
      <gray>Turns a Diamond Furnace into an Emerald Furnace
  upgrade_obsidian:
    name: "<6>Upgrade: Emerald → Obsidian"
    lore: |-
      <gray>Turns an Emerald Furnace into an Obsidian Furnace
  upgrade_obsidian2:
    name: "<6>Upgrade: Crystal → Obsidian"
    lore: |-
      <gray>Turns a Crystal Furnace into an Obsidian Furnace
  upgrade_netherite:
    name: "<6>Upgrade: Obsidian → Netherite"
    lore: |-
      <gray>Turns an Obsidian Furnace into a Netherite Furnace

  rainbow_core:
    name: "<d>Rainbow Core"
    lore: |-
      <gray>Core material for crafting advanced furnaces

  rainbow_plating:
    name: "<d>Rainbow Plating"
    lore: |-
      <gray>Plating material wrapped around the Rainbow Core

  rainbow_coal:
    name: "<d>Rainbow Coal"
    lore: |-
      <gray>Efficient Rainbow fuel, burns 10x longer than coal

  blast_upgrade:
    name: "<e>Blast Furnace Component"
    lore: |-
      <gray>Allows furnace to smelt ores at 2x speed
      <gray>(e.g., Iron Ore → Iron Ingot)

  smoker_upgrade:
    name: "<a>Smoker Component"
    lore: |-
      <gray>Allows furnace to cook food at 2x speed

  speed_upgrade:
    name: "<b>Speed Upgrade"
    lore: |-
      <gray>Halves smelting time
      <gray>Doubles fuel consumption

  fuel_upgrade:
    name: "<6>Fuel Upgrade"
    lore: |-
      <gray>Doubles fuel efficiency
      <gray>Increases smelting time by 25%

  industrial_upgrade:
    name: "<7>Factory Upgrade"
    lore: |-
      <gray>Adds up to 6 input and output slots (2/4/6 by tier)
      <gray>Every input slot smelts in parallel
      <gray>Removes the fuel slot, runs on power instead

  generator_upgrade:
    name: "<c>Generator Upgrade"
    lore: |-
      <gray>Converts excess heat into energy
      <gray>Powers nearby machines

  copy_tool:
    name: "<b>Furnace Config Copier"
    lore: |-
      <gray>Right-click a furnace to copy its settings
      <gray>Sneak + right-click another to apply them
      <dark_gray>(side modes + auto I/O + redstone)

  copper_furnace:
    name: "<6>Copper Furnace"
    lore: |-
      <gray>Basic furnace, smelts at 180 ticks/item

  iron_furnace:
    name: "<7>Iron Furnace"
    lore: |-
      <gray>Advanced furnace, smelts at 160 ticks/item

  gold_furnace:
    name: "<e>Gold Furnace"
    lore: |-
      <gray>High-tier furnace, smelts at 120 ticks/item

  diamond_furnace:
    name: "<b>Diamond Furnace"
    lore: |-
      <gray>Rare furnace, smelts at 80 ticks/item

  emerald_furnace:
    name: "<a>Emerald Furnace"
    lore: |-
      <gray>Precious furnace, smelts at 40 ticks/item
      <gray>Same tier as Crystal Furnace

  crystal_furnace:
    name: "<d>Crystal Furnace"
    lore: |-
      <gray>Crystalline furnace, smelts at 40 ticks/item
      <gray>Same tier as Emerald Furnace

  obsidian_furnace:
    name: "<5>Obsidian Furnace"
    lore: |-
      <gray>Ultra-hard furnace, smelts at 20 ticks/item

  netherite_furnace:
    name: "<c>Netherite Furnace"
    lore: |-
      <gray>Ultimate furnace, smelts at 5 ticks/item

  rainbow_furnace:
    name: "<d>Rainbow Furnace"
    lore: |-
      <gray>Legendary furnace, smelts 64 items at once
      <gray>Smelting speed: 20 ticks/batch

gui:
  title: "<yellow>Furnace"

  upgrade:
    name: "<yellow>⚙ Upgrades"
    lore: "<gray><insn>Click</insn> to open upgrade panel"

  fuel_status:
    name: "<gold>🔥 Fuel"
    lore: "<arrow> %fuel%"

  smelt_progress:
    name: "<yellow>⚒ Smelting"
    lore: "<gray>Speed: <white>%speed% <gray>(vs vanilla furnace)"

  no_fuel: "<gray>No fuel"

  back_button:
    name: "<yellow>← Back"
    lore: ""

  redstone:
    name: "<red>🔌 Redstone control"
    lore: "<gray>Current mode: <white>%mode%"
    hint: "<gray><insn>Click</insn> to cycle"

  side_config:
    name: "<aqua>🧭 Side configuration"
    lore: "<gray>Set the I/O direction of each face"
    hint: "<gray><insn>Click</insn> to open panel"

  upgrade_red:
    name: "<red>🔴 Special Smelting"
    lore: "<gray>Blast furnace / Smoker component"

  upgrade_green:
    name: "<green>🟢 Efficiency"
    lore: "<gray>Speed / Fuel upgrade"

  upgrade_blue:
    name: "<blue>🔵 Extensions"
    lore: "<gray>Factory / Generator upgrade"

  # autoSplit — a **furnace-level** toggle (not a side setting), so the button
  # lives on the furnace's own screen
  auto_split:
    name: "<e>Auto Split"
    lore: "<gray>State: %state%"
    hint: "<dark_gray>Spread incoming items across all factory slots"
  state_on: "<a>On"
  state_off: "<8>Off"

  no_item: "<gray>No items"

redstone:
  ignored: "<gray>Redstone: ignored"
  low: "<gray>Redstone: stops on signal"
  high: "<gray>Redstone: runs only on signal"

message:
  redstone_mode: "<yellow>Redstone mode: %mode%"
  upgrade_success: "<green>Successfully upgraded to %furnace%!"
  upgrade_failed: "<red>Upgrade failed! Check your materials."
  upgrade_already_max: "<yellow>This furnace is already max level."
  install_upgrade: "<green>Successfully installed %upgrade% component!"
  remove_upgrade: "<yellow>Removed %upgrade% component."
  furnace_not_found: "<red>This is not a valid furnace."
  upgrade_wrong_tier: "<red>That upgrade does not match this furnace's tier."
  heater_bound: "<green>Bound this rod to the heater."
  copy_copied: "<green>Copied this furnace's settings."
  copy_applied: "<green>Applied the settings to this furnace."
  copy_empty: "<red>The copier is empty — right-click a furnace to copy first."
  auto_split: "<yellow>Auto Split: %state%"

addon: "Lapis-IronFurnaces"

guide:
  page:
    ironfurnaces: "<yellow>Lapis-IronFurnaces"

item:
  rainbow_core:
    name: "<d>Rainbow Core"
    lore: |-
      <gray>Core material for crafting advanced furnaces

  rainbow_shell:
    name: "<d>Rainbow Shell"
    lore: |-
      <gray>Protective shell for Rainbow Core

  rainbow_coal:
    name: "<d>Rainbow Coal"
    lore: |-
      <gray>Efficient Rainbow fuel, burns 10x longer than coal

  rainbow_connector:
    name: "<d>Rainbow Connector"
    lore: |-
      <gray>Special item for connecting Rainbow components

  blast_upgrade:
    name: "<e>Blast Furnace Component"
    lore: |-
      <gray>Allows furnace to smelt ores at 2x speed
      <gray>(e.g., Iron Ore → Iron Ingot)

  smoker_upgrade:
    name: "<a>Smoker Component"
    lore: |-
      <gray>Allows furnace to cook food at 2x speed

  speed_upgrade:
    name: "<b>Speed Upgrade"
    lore: |-
      <gray>Halves smelting time
      <gray>Doubles fuel consumption

  fuel_upgrade:
    name: "<6>Fuel Upgrade"
    lore: |-
      <gray>Doubles fuel efficiency
      <gray>Increases smelting time by 25%

  industrial_upgrade:
    name: "<7>Factory Upgrade"
    lore: |-
      <gray>Adds up to 6 input and output slots (2/4/6 by tier)
      <gray>Every input slot smelts in parallel
      <gray>Removes the fuel slot, runs on power instead

  generator_upgrade:
    name: "<c>Generator Upgrade"
    lore: |-
      <gray>Converts excess heat into energy
      <gray>Powers nearby machines

  copper_furnace:
    name: "<6>Copper Furnace"
    lore: |-
      <gray>Basic furnace, smelts at 180 ticks/item

  iron_furnace:
    name: "<7>Iron Furnace"
    lore: |-
      <gray>Advanced furnace, smelts at 160 ticks/item

  gold_furnace:
    name: "<e>Gold Furnace"
    lore: |-
      <gray>High-tier furnace, smelts at 120 ticks/item

  diamond_furnace:
    name: "<b>Diamond Furnace"
    lore: |-
      <gray>Rare furnace, smelts at 80 ticks/item

  emerald_furnace:
    name: "<a>Emerald Furnace"
    lore: |-
      <gray>Precious furnace, smelts at 40 ticks/item
      <gray>Same tier as Crystal Furnace

  crystal_furnace:
    name: "<d>Crystal Furnace"
    lore: |-
      <gray>Crystalline furnace, smelts at 40 ticks/item
      <gray>Same tier as Emerald Furnace

  obsidian_furnace:
    name: "<5>Obsidian Furnace"
    lore: |-
      <gray>Ultra-hard furnace, smelts at 20 ticks/item

  netherite_furnace:
    name: "<c>Netherite Furnace"
    lore: |-
      <gray>Ultimate furnace, smelts at 5 ticks/item

  rainbow_furnace:
    name: "<d>Rainbow Furnace"
    lore: |-
      <gray>Legendary furnace, smelts 64 items at once
      <gray>Smelting speed: 20 ticks/batch

gui:
  title: "<yellow>Furnace"

  upgrade:
    name: "<yellow>⚙ Upgrades"
    lore: "<gray><insn>Click</insn> to open upgrade panel"

  fuel_status:
    name: "<gold>🔥 Fuel"
    lore: "<arrow> %fuel%"

  smelt_progress:
    name: "<yellow>⚒ Smelting"
    lore: "<gray>Speed: <white>%speed% <gray>(vs vanilla furnace)"

  no_fuel: "<gray>No fuel"

  back_button:
    name: "<yellow>← Back"
    lore: ""

  redstone:
    name: "<red>🔌 Redstone control"
    lore: "<gray>Current mode: <white>%mode%"
    hint: "<gray><insn>Click</insn> to cycle"

  upgrade_red:
    name: "<red>🔴 Special Smelting"
    lore: "<gray>Blast furnace / Smoker component"

  upgrade_green:
    name: "<green>🟢 Efficiency"
    lore: "<gray>Speed / Fuel upgrade"

  upgrade_blue:
    name: "<blue>🔵 Extensions"
    lore: "<gray>Factory / Generator upgrade"

  no_item: "<gray>No items"

redstone:
  ignored: "<gray>Redstone: ignored"
  low: "<gray>Redstone: stops on signal"
  high: "<gray>Redstone: runs only on signal"

message:
  redstone_mode: "<yellow>Redstone mode: %mode%"
  upgrade_success: "<green>Successfully upgraded to %furnace%!"
  upgrade_failed: "<red>Upgrade failed! Check your materials."
  upgrade_already_max: "<yellow>This furnace is already max level."
  install_upgrade: "<green>Successfully installed %upgrade% component!"
  remove_upgrade: "<yellow>Removed %upgrade% component."
  furnace_not_found: "<red>This is not a valid furnace."
